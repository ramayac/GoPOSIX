name: golangci-lint

on:
  pull_request:
    branches: ["**"]
    paths-ignore:
      - '**.md'

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Built with go1.27; the project targets Go 1.26, and older
          # linter binaries (go1.24) refuse to load the config.
          version: v2.14.0
          only-new-issues: true
